name: Prueba Termux

# Ejecuta el binario de Android dentro de un entorno Termux real
# (termux-docker, con bionic) para comprobar que instala y arranca.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release que probar"
        required: true

jobs:
  termux:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Descargar binario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir d && cd d
          gh release download "${{ github.event.inputs.tag }}" -R "${{ github.repository }}" -p infinito-android-termux-arm64
          chmod 755 infinito-android-termux-arm64
      - name: Instalar y arrancar en Termux
        run: |
          cat > d/test.sh <<'SH'
          set -x
          cd ~
          B=/d/infinito-android-termux-arm64
          $B version
          $B install
          ( INFINITO_GUI_TOKEN=prueba $B gui --no-open > serve.log 2>&1 & )
          ok=0
          for i in $(seq 1 60); do
            sleep 3
            f=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/v1/models)
            st=$(curl -s -H 'X-Token: prueba' http://127.0.0.1:8686/app/api/state)
            echo "intento $i: freellmapi=$f gui=$st"
            if echo "$st" | grep -q '"ok":true'; then ok=1; break; fi
          done
          tail -20 serve.log
          for l in ~/.infinito/logs/*.log; do echo "--- $l"; tail -30 "$l"; done
          [ $ok = 1 ]
          SH
          docker run --rm --privileged -v "$PWD/d:/d" termux/termux-docker:aarch64 bash /d/test.sh

  sin-termux:
    # Como dentro del APK: sin las bibliotecas de Termux en /data/data/com.termux.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Descargar binario
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir d && cd d
          gh release download "${{ github.event.inputs.tag }}" -R "${{ github.repository }}" -p infinito-android-termux-arm64
          chmod 755 infinito-android-termux-arm64
      - name: Instalar y arrancar sin Termux
        run: |
          cat > d/test.sh <<'SH'
          # Solo órdenes internas de bash mientras las bibliotecas de Termux están escondidas.
          P=/data/data/com.termux/files/usr
          A=/data/data/com.termux/files/apptest; mkdir -p $A/home $A/cache
          cp /d/infinito-android-termux-arm64 $A/libinfinito.so
          mkfifo $A/f
          ultimas() { local -a L; mapfile -t L < "$1"; local n=${#L[@]}; local s=$(( n > $2 ? n - $2 : 0 )); printf '%s\n' "${L[@]:s}"; }
          hget() { if exec 5<>/dev/tcp/127.0.0.1/$1; then printf 'GET %s HTTP/1.0\r\nHost: 127.0.0.1\r\nAuthorization: Bearer %s\r\n\r\n' "$2" "$3" >&5; read -t 30 -r l <&5; echo "$1$2 -> $l"; exec 5>&-; else echo "$1 cerrado"; fi; }
          export HOME=$A/home TMPDIR=$A/cache INFINITO_HOME=$A/config INFINITO_DATA=$A/infinito INFINITO_ANDROID_APP=1
          mv $P/lib $P/lib.off
          # Como en un móvil con Termux instalado: su carpeta existe pero no se puede leer.
          chmod 000 $P/etc
          echo "== install"; PATH=/system/bin:/system/xbin $A/libinfinito.so install > $A/install.log 2>&1; echo "salida $?"
          ultimas $A/install.log 5
          LD_LIBRARY_PATH=$A/infinito/runtime/termux/usr/lib $A/infinito/runtime/termux/usr/bin/node -v; echo "node salida $?"
          (PATH=/system/bin:/system/xbin exec $A/libinfinito.so gui --no-open > $A/serve.log 2>&1) &
          for i in 1 2 3 4 5 6 7 8; do
            read -t 20 <> $A/f
            C=$(<$A/config/config.json); FK=
            [[ $C =~ (freellmapi-[0-9a-f]+) ]] && FK=${BASH_REMATCH[1]}
            hget 3001 /v1/models "$FK"
          done
          [[ -n $FK ]] && echo "clave de freellmapi configurada"
          hget 8686 /app/
          echo "== serve.log"; ultimas $A/serve.log 30
          for l in $A/infinito/logs/*.log; do echo "--- $l"; ultimas "$l" 50; done
          mv $P/lib.off $P/lib
          SH
          docker run --rm --privileged -v "$PWD/d:/d" termux/termux-docker:aarch64 bash /d/test.sh
