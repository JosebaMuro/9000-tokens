name: apk-arm-test
on:
  workflow_dispatch:
    inputs:
      binario:
        description: "Release del que tomar el binario de Termux completo (vacío = compilarlo)"
        default: "v1.1.1"
jobs:
  emulador:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: APK de depuración con el binario arm64 completo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          gh release download "${{ inputs.binario }}" -p infinito-android-termux-arm64 -O android/app/src/main/jniLibs/arm64-v8a/libinfinito.so
          gradle -p android assembleDebug --no-daemon
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8G
          disable-animations: true
          script: bash scripts/apk-arm-test.sh android/app/build/outputs/apk/debug/app-debug.apk
