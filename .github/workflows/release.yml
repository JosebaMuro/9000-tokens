name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (p. ej. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: termux-arm64
            os: ubuntu-24.04-arm
          - target: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: go vet ./... && go test ./...
      - name: Construir paquete offline
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config --global core.longpaths true
          WORK="${RUNNER_TEMP}/work" scripts/build-pack.sh "${{ matrix.target }}" dist
      - name: Probar el binario completo
        if: matrix.target != 'termux-arm64'
        run: scripts/smoke-test.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          compression-level: 0
          retention-days: 3

  # APK para Android: terminal propia con Infinito y el paquete offline dentro.
  apk:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: termux-arm64
          path: art
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp art/infinito-android-termux-arm64 android/app/src/main/jniLibs/arm64-v8a/libinfinito.so
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/infinito.jks"
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/infinito.jks"
          else
            echo "::warning::Sin clave de firma en los secretos: el APK se firma con una clave temporal."
          fi
          gradle -p android assembleRelease -PappVersion="${TAG#v}" -PappCode="${{ github.run_number }}" --no-daemon
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/infinito-android-arm64.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*
          compression-level: 0
          retention-days: 3

  # Prueba la app en un emulador Android (x86_64, con la versión ligera).
  apk-test:
    needs: build
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64
          path: art
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar APK de prueba
        run: |
          mkdir -p android/app/src/main/jniLibs/x86_64
          cp art/infinito-linux-x64-ligero android/app/src/main/jniLibs/x86_64/libinfinito.so
          gradle -p android assembleDebug -Pabis=x86_64 --no-daemon
      - name: Activar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash scripts/apk-test.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pruebas-apk
          path: shots/*
          retention-days: 7

  release:
    needs: [build, apk, apk-test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Quitar archivos de prueba
        run: rm -f dist/*.png dist/*.txt dist/*.xml
      - name: Sumas SHA-256
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Infinito $TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
          # Restos de pruebas subidos por error en ejecuciones anteriores.
          for a in $(gh release view "$TAG" --json assets -q '.assets[].name' | grep -E '\.(txt|png|xml)$' | grep -v SHA256SUMS); do
            gh release delete-asset "$TAG" "$a" -y || true
          done
          gh release upload "$TAG" dist/* --clobber
