name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta del release (p. ej. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: termux-arm64
            os: ubuntu-24.04-arm
          - target: win-x64
            os: windows-2022
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: go vet ./... && go test ./...
      - name: Construir paquete offline
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          git config --global core.longpaths true
          WORK="${RUNNER_TEMP}/work" scripts/build-pack.sh "${{ matrix.target }}" dist
      - name: Probar el binario completo
        if: matrix.target != 'termux-arm64'
        run: scripts/smoke-test.sh dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*
          compression-level: 0
          retention-days: 3

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Sumas SHA-256
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Infinito $TAG" --notes-file RELEASE_NOTES.md --target "$GITHUB_SHA"
          fi
          gh release upload "$TAG" dist/* --clobber
